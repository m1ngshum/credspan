name: Prepare public source preview
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Preview tag, for example v0.1.0-preview.1"
        required: true
        type: string
permissions: {}
jobs:
  prepare:
    if: github.repository == 'm1ngshum/credspan' && !github.event.repository.private && github.ref == 'refs/heads/main' && github.ref_protected
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: node ops/release-gate.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: node ops/source-preview.mjs "$PREVIEW_VERSION" "$GITHUB_SHA" "$RUNNER_TEMP/source-preview"
        env:
          PREVIEW_VERSION: ${{ inputs.version }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-preview-candidate
          path: ${{ runner.temp }}/source-preview/
          if-no-files-found: error
          retention-days: 7
