name: Private release artifact qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  artifacts:
    if: github.event.repository.private == true && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: node ops/release-gate.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: node ops/build.mjs
      - run: node ops/artifacts.mjs "$RUNNER_TEMP/credspan-artifacts"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-private-release-evidence
          retention-days: 1
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/credspan-artifacts/manifest.json
            ${{ runner.temp }}/credspan-artifacts/image.tar
            ${{ runner.temp }}/credspan-artifacts/sbom.spdx.json
            ${{ runner.temp }}/credspan-artifacts/vulnerabilities.json
  sign:
    needs: artifacts
    if: github.event.repository.private == true && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: private-release
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: node ops/release-gate.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-private-release-evidence
          path: ${{ runner.temp }}/credspan-artifacts
      - name: Verify every artifact and prepare pinned signing binary without secrets
        run: |
          node --input-type=module <<'JS'
          import { verifyManifest } from './ops/artifacts.mjs';
          import { tool } from './ops/tools.mjs';
          const directory = process.env.RUNNER_TEMP + '/credspan-artifacts';
          await verifyManifest(directory, directory + '/manifest.json', process.env.GITHUB_SHA);
          await tool('cosign');
          JS
      - name: Sign verified manifest without transparency upload
        env:
          PRIVATE_SIGNING_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          node --input-type=module <<'JS'
          import { writeFile, unlink } from 'node:fs/promises';
          import { signManifest } from './ops/artifacts.mjs';
          if (!process.env.PRIVATE_SIGNING_KEY) throw Error('Private signing key must be provisioned separately');
          const key = process.env.RUNNER_TEMP + '/credspan-signing.key';
          const directory = process.env.RUNNER_TEMP + '/credspan-artifacts';
          try {
            await writeFile(key, process.env.PRIVATE_SIGNING_KEY, { flag: 'wx', mode: 0o600 });
            delete process.env.PRIVATE_SIGNING_KEY;
            await signManifest(directory, directory + '/manifest.json', key);
          } finally { await unlink(key).catch(() => {}); }
          JS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: private-release-evidence
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/credspan-artifacts/manifest.json
            ${{ runner.temp }}/credspan-artifacts/manifest.sigstore.json
            ${{ runner.temp }}/credspan-artifacts/signer.pub
            ${{ runner.temp }}/credspan-artifacts/image.tar
            ${{ runner.temp }}/credspan-artifacts/sbom.spdx.json
            ${{ runner.temp }}/credspan-artifacts/vulnerabilities.json
