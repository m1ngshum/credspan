name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      docs: ${{ steps.plan.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: node --test scripts/check-foundation.test.mjs scripts/ci-plan.test.mjs vendor/waltid/build-peer.test.mjs
      - run: node scripts/check-foundation.mjs
      - id: plan
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci-plan.mjs
  native:
    needs: changes
    if: needs.changes.outputs.docs == 'false'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: npx --yes pnpm@12.18.0 install --frozen-lockfile
      - run: npx --yes pnpm@12.18.0 check
      - run: npx --yes pnpm@12.18.0 test:storage
  integration:
    needs: changes
    if: needs.changes.outputs.docs == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: npx --yes pnpm@12.18.0 install --frozen-lockfile
      - id: peer-key
        run: echo "key=$(node vendor/waltid/build-peer.mjs --cache-key)" >> "$GITHUB_OUTPUT"
      - id: peer-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/credspan-peer-cache
          key: ${{ steps.peer-key.outputs.key }}
      - run: node vendor/waltid/build-peer.mjs
        env:
          CREDSPAN_PEER_CACHE: ${{ runner.temp }}/credspan-peer-cache
      - run: npx --yes pnpm@12.18.0 test:integration
      - run: npx --yes pnpm@12.18.0 --filter @credspan/api exec playwright install --with-deps chromium
      - run: npx --yes pnpm@12.18.0 test:browser
      - run: node ops/build.mjs
      - run: npx --yes pnpm@12.18.0 test:operations
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.peer-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/credspan-peer-cache
          key: ${{ steps.peer-key.outputs.key }}
  mcp:
    needs: changes
    if: needs.changes.outputs.docs == 'false'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 84f16d82ef3851d78a5f7dcd789280601e088789 # clean API source snapshot; matches packages/mcp/runtime.json
          path: runtime
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: source/.node-version
      - run: npx --yes pnpm@12.18.0 install --frozen-lockfile
        working-directory: source
      - run: node ops/build.mjs
        working-directory: runtime
      - id: peer-key
        run: echo "key=$(node source/vendor/waltid/build-peer.mjs --cache-key)" >> "$GITHUB_OUTPUT"
      - id: peer-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/credspan-peer-cache
          key: ${{ steps.peer-key.outputs.key }}
      - run: node vendor/waltid/build-peer.mjs
        working-directory: source
        env:
          CREDSPAN_PEER_CACHE: ${{ runner.temp }}/credspan-peer-cache
      - run: node ops/cache-sandbox-images.mjs
        working-directory: source
      - run: npx --yes pnpm@12.18.0 test:mcp
        working-directory: source
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.peer-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/credspan-peer-cache
          key: ${{ steps.peer-key.outputs.key }}
  ci:
    name: ci
    needs: [changes, native, integration, mcp]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci-plan.mjs gate
